name: Smart import checks
on:
  push:
    branches: [main, "smart-import/**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node --check public/app.js
      - run: node --check netlify/functions/import-product.cjs
      - run: node --check netlify/lib/product-import.cjs
