name: Smart import checks
on:
  push:
    branches: [main, "smart-import/**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node --check public/app.js
      - run: node --check netlify/functions/import-product.cjs
      - run: node --check netlify/lib/product-import.cjs
      - name: Live public product matrix (no API keys)
        if: startsWith(github.ref, 'refs/heads/smart-import/')
        timeout-minutes: 5
        run: node tests/live-import.cjs
      - uses: actions/upload-artifact@v4
        if: always() && startsWith(github.ref, 'refs/heads/smart-import/')
        with:
          name: live-import-results
          path: live-import-results.json
